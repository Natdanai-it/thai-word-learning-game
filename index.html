<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087fbd" />
    <title>คลังคำไทย | วิดีโอและเกมคำไวพจน์ ม.4</title>
    <meta name="description" content="เรียนรู้คำไวพจน์ผ่านวิดีโอสั้นและเกมจิ้มคำที่ถูก" />
    <style>
      :root {
        --bg: #f5f7fb;
        --ink: #17243b;
        --muted: #68778b;
        --line: #dce5ef;
        --blue: #087fbd;
        --deep: #173b67;
        --gold: #f6bd27;
        --red: #ef3340;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 10% 5%, #f6bd2720, transparent 23rem),
          radial-gradient(circle at 94% 20%, #087fbd1c, transparent 27rem), var(--bg);
        color: var(--ink);
        font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, Arial, sans-serif;
        transition: background .25s ease, color .25s ease;
      }
      body::before { content: ""; position: fixed; inset: auto -120px -180px auto; width: 420px; height: 420px; border-radius: 50%; background: linear-gradient(135deg, #087fbd12, #f6bd2718); filter: blur(2px); pointer-events: none; z-index: -1; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .shell { width: min(1420px, calc(100% - 32px)); margin: 0 auto; }
      .header { position: sticky; top: 0; z-index: 10; background: #fffffff2; border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); }
      .header::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--blue) 0 48%, var(--gold) 48% 73%, var(--red) 73%); }
      .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .logo { width: 48px; height: 48px; flex: 0 0 auto; display: grid; place-items: center; overflow: hidden; border-radius: 14px; background: white; box-shadow: 0 5px 18px #14436722; }
      .logo img { width: 44px; height: 44px; object-fit: contain; }
      .kicker { margin: 0 0 2px; color: var(--blue); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
      h1, h2, h3, h4, p { margin-top: 0; }
      h1 { margin-bottom: 0; font-size: 21px; line-height: 1.15; }
      .header-tools { display: flex; align-items: center; gap: 12px; }
      .teacher { color: #526177; text-align: right; font-size: 13px; line-height: 1.5; }
      .teacher strong { display: block; color: #263c5a; }
      .theme-toggle { width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 13px; background: #ffffffdd; color: var(--deep); font-size: 19px; box-shadow: 0 5px 16px #1f3f5c10; transition: .18s ease; }
      .theme-toggle:hover { transform: translateY(-2px); border-color: var(--blue); color: var(--blue); }
      main { padding: 24px 0 42px; }
      .intro { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; }
      .intro::before { content: ""; position: absolute; top: -10px; left: -34px; width: 150px; height: 150px; border-radius: 40% 60% 60% 40%; background: linear-gradient(145deg, #087fbd14, #f6bd2719); transform: rotate(16deg); pointer-events: none; }
      .intro > div { position: relative; }
      .eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--blue); font-size: 13px; font-weight: 900; letter-spacing: .04em; }
      .intro h2 { margin: 8px 0 5px; color: var(--deep); font-size: clamp(27px, 4vw, 44px); line-height: 1.15; letter-spacing: -.035em; }
      .intro p { margin-bottom: 0; color: var(--muted); font-size: 16px; }
      .profile { display: flex; align-items: center; gap: 13px; min-width: 460px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 18px; background: #ffffffe8; box-shadow: 0 10px 34px #1f3f5c12; }
      .profile-icon { font-size: 24px; }
      .profile label { display: grid; gap: 3px; flex: 1; }
      .profile label span { color: #6b7789; font-size: 12px; font-weight: 800; }
      .profile input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; }
      .profile input::placeholder { color: #a4aeba; font-weight: 500; }
      .class-field { max-width: 98px; padding-left: 13px; border-left: 1px solid #e2e8f0; }
      .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 20px; }
      .tab { min-height: 72px; display: flex; align-items: center; gap: 11px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 17px; background: #ffffffe0; color: #4d5c72; text-align: left; transition: .18s ease; }
      .tab:hover { transform: translateY(-1px); border-color: #b8cfdf; }
      .tab.active { border-color: var(--blue); color: var(--deep); box-shadow: 0 10px 28px #087fbd1f; }
      .tab-number { width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 12px; background: #edf2f7; color: #728096; font-size: 13px; font-weight: 900; }
      .tab.active .tab-number { background: var(--blue); color: white; }
      .tab-text { min-width: 0; }
      .tab strong, .tab small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab strong { font-size: 15px; }
      .tab small { margin-top: 2px; color: #8490a1; font-size: 11px; font-weight: 700; }
      .tab-status { margin-left: auto; font-size: 18px; }
      .workspace { display: grid; grid-template-columns: minmax(0, 1.07fr) minmax(380px, .93fr); gap: 18px; align-items: stretch; margin-top: 20px; }
      .card { overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #fffffff5; box-shadow: 0 20px 52px #1d416316; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
      .card:hover { transform: translateY(-2px); box-shadow: 0 25px 58px #1d416322; }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 78px; padding: 16px 20px; border-bottom: 1px solid #e7edf4; }
      .card-head span { color: #7c899a; font-size: 11px; font-weight: 850; letter-spacing: .08em; }
      .card-head h3 { margin: 3px 0 0; color: var(--deep); font-size: 20px; }
      .pill { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 8px 11px; border-radius: 999px; background: #f2f5f8; color: #69778a; font-size: 12px; font-weight: 800; }
      .video-frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #101825; }
      .video-frame video { display: block; width: 100%; height: 100%; object-fit: contain; background: #0d1725; }
      .video-badge { position: absolute; top: 12px; left: 12px; padding: 7px 10px; border-radius: 999px; background: #0b192bcc; color: white; font-size: 12px; font-weight: 800; pointer-events: none; }
      .watch { padding: 15px 20px 18px; }
      .watch-row { display: flex; justify-content: space-between; gap: 12px; color: #42536a; font-size: 14px; font-weight: 700; }
      .watch-row strong { color: var(--lesson-accent); }
      .progress { height: 10px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: #edf1f5; }
      .progress > div { width: 0%; height: 100%; border-radius: inherit; background: var(--lesson-accent); transition: width .2s ease; }
      .watch-note { margin: 10px 0 0; color: #7b8797; font-size: 12px; }
      .video-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
      .video-tools > span { color: #718096; font-size: 12px; font-weight: 800; }
      .video-rate-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      .video-rate { min-width: 44px; padding: 6px 8px; border: 1px solid #d8e2eb; border-radius: 9px; background: #f8fafc; color: #617087; font-size: 11px; font-weight: 850; }
      .video-rate.active { border-color: var(--lesson-accent); background: color-mix(in srgb, var(--lesson-accent) 11%, white); color: var(--lesson-accent); }
      .game { min-height: 540px; display: flex; flex-direction: column; }
      .game-head { display: flex; align-items: center; justify-content: space-between; gap: 13px; min-height: 78px; padding: 15px 20px; border-bottom: 1px solid #e7edf4; }
      .game-title { display: flex; align-items: center; gap: 10px; }
      .game-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: color-mix(in srgb, var(--lesson-accent) 13%, white); color: var(--lesson-accent); font-size: 22px; }
      .game-head span { color: #7c899a; font-size: 11px; font-weight: 850; letter-spacing: .08em; }
      .game-head h3 { margin: 3px 0 0; color: var(--deep); font-size: 20px; }
      .game-body { flex: 1; padding: 18px 20px 20px; }
      .mode-switch { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
      .mode-button { min-height: 36px; padding: 7px 11px; border: 1px solid #d8e2eb; border-radius: 10px; background: #f8fafc; color: #5d6d82; font-size: 12px; font-weight: 850; }
      .mode-button.active { border-color: var(--lesson-accent); background: color-mix(in srgb, var(--lesson-accent) 11%, white); color: var(--lesson-accent); }
      .match-card { margin-top: 14px; padding: 17px; border: 1px solid #dce5ef; border-radius: 18px; background: linear-gradient(145deg, #f8fbfd, #f4f8fc); }
      .match-card > p { margin: 0; color: #68778b; font-size: 12px; font-weight: 800; }
      .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
      .match-column { display: grid; gap: 8px; }
      .match-column-title { color: #8793a4; font-size: 11px; font-weight: 900; letter-spacing: .04em; }
      .match-word { width: 100%; min-height: 46px; padding: 9px 11px; border: 1px solid #d8e2eb; border-radius: 12px; background: white; color: #34445a; text-align: left; font-size: 14px; font-weight: 850; transition: .16s ease; }
      .match-word:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--lesson-accent); }
      .match-word.selected { border-color: var(--lesson-accent); background: color-mix(in srgb, var(--lesson-accent) 11%, white); color: var(--lesson-accent); }
      .match-word.matched { border-color: #9edbc1; background: #effaf5; color: #14734b; }
      .match-word.wrong { border-color: #df5363; background: #fff0f2; color: #ad2538; }
      .match-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; color: #65758a; font-size: 12px; font-weight: 800; }
      .match-status strong { color: var(--lesson-accent); }
      .match-feedback { margin-top: 10px; padding: 10px 12px; border-radius: 11px; background: #fff5f6; color: #a42e42; font-size: 12px; font-weight: 800; }
      .context-card { margin-top: 14px; padding: 18px; border: 1px solid #dce5ef; border-radius: 18px; background: #f8fbfd; }
      .context-label { margin: 0 0 8px; color: #68778b; font-size: 12px; font-weight: 800; }
      .context-sentence { margin: 0; color: var(--deep); font-size: 20px; line-height: 1.55; font-weight: 900; }
      .context-options { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }
      .context-option { min-height: 50px; padding: 10px 13px; border: 1px solid #d8e2eb; border-radius: 13px; background: white; color: #34445a; text-align: left; font-size: 15px; font-weight: 850; }
      .context-option.selected { border-color: var(--lesson-accent); background: color-mix(in srgb, var(--lesson-accent) 11%, white); color: var(--lesson-accent); }
      .context-option.correct { border-color: #28a76d; background: #e9f9f1; color: #117348; }
      .context-option.wrong { border-color: #df5363; background: #fff0f2; color: #ad2538; }
      .context-option.muted { opacity: .5; }
      .context-feedback { margin-top: 12px; padding: 12px 13px; border-radius: 13px; background: #effaf5; color: #126f48; font-size: 13px; line-height: 1.5; }
      .speed-card { margin-top: 14px; padding: 18px; border-radius: 18px; background: linear-gradient(135deg, #172f5a, #126d82); color: white; }
      .speed-intro { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
      .speed-intro h4 { margin: 0; font-size: 20px; }
      .speed-intro p { margin: 4px 0 0; color: #bde8f3; font-size: 12px; }
      .speed-time { min-width: 59px; padding: 9px 10px; border: 1px solid #ffffff42; border-radius: 13px; color: #fff3b8; text-align: center; font-size: 24px; font-weight: 950; }
      .speed-question { margin: 17px 0 10px; color: #e4f8ff; font-size: 14px; }
      .speed-question strong { display: block; margin-top: 3px; color: white; font-size: 22px; }
      .speed-words { display: flex; flex-wrap: wrap; gap: 8px; }
      .speed-word { min-height: 42px; padding: 8px 13px; border: 1px solid #ffffff5c; border-radius: 999px; background: #ffffff18; color: white; font-size: 14px; font-weight: 850; }
      .speed-word:hover { background: #ffffff32; }
      .speed-start { width: 100%; min-height: 47px; margin-top: 15px; border: 0; border-radius: 12px; background: var(--gold); color: #473400; font-size: 14px; font-weight: 950; }
      .speed-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; color: #bde8f3; font-size: 12px; font-weight: 800; }
      .overview { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; margin-top: 18px; padding: 15px 17px; border: 1px solid #dce5ef; border-radius: 19px; background: #ffffffe8; box-shadow: 0 8px 24px #1f3f5c0c; }
      .overview-main { min-width: 0; }
      .overview-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .overview strong, .overview small { display: block; }
      .overview strong { color: var(--deep); font-size: 15px; }
      .overview small { margin-top: 3px; color: #718096; font-size: 12px; }
      .overview-score { padding: 7px 10px; border-radius: 10px; background: #eef7fb; color: var(--blue); font-size: 13px; font-weight: 900; }
      .overall-progress { height: 7px; margin-top: 11px; overflow: hidden; border-radius: 999px; background: #edf1f5; }
      .overall-progress > div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), #44b88a, var(--gold)); transition: width .25s ease; }
      .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
      .badge { padding: 5px 8px; border: 1px solid #dce5ef; border-radius: 999px; background: #f7f9fb; color: #8793a4; font-size: 11px; font-weight: 850; }
      .badge.earned { border-color: #bce4d2; background: #effaf5; color: #16734c; }
      .overview-actions { display: grid; justify-items: end; gap: 9px; }
      .overview-complete { color: #7b8797; font-size: 11px; font-weight: 800; text-align: right; }
      .reset-progress, .share-result { border: 1px solid #d8e2eb; border-radius: 10px; background: #f8fafc; color: #617087; font-size: 11px; font-weight: 850; }
      .reset-progress { padding: 8px 10px; }
      .reset-progress:hover, .share-result:hover { border-color: var(--blue); color: var(--blue); }
      .locked, .result { min-height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
      .lock-art, .trophy { width: 78px; height: 78px; display: grid; place-items: center; border-radius: 27px; background: #eef3f8; color: #8694a7; font-size: 38px; transform: rotate(-4deg); }
      .locked h4, .result h4 { margin: 18px 0 4px; color: var(--deep); font-size: 22px; }
      .locked p, .result p { max-width: 390px; margin-bottom: 0; color: #738095; font-size: 14px; line-height: 1.65; }
      .requirements { width: min(100%, 370px); display: grid; gap: 8px; margin-top: 20px; }
      .requirement { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid #e1e8ef; border-radius: 13px; background: #f8fafc; color: #788597; text-align: left; font-size: 13px; font-weight: 750; }
      .requirement.done { border-color: #bce4d2; background: #f0fbf6; color: #16734c; }
      .score-strip { display: flex; flex-wrap: wrap; gap: 8px; }
      .score-strip span { padding: 6px 9px; border-radius: 9px; background: #f2f6f9; color: #617087; font-size: 12px; font-weight: 800; }
      .question { position: relative; margin-top: 14px; padding: 20px; overflow: hidden; border-radius: 18px; background: linear-gradient(135deg, var(--deep), #1b5785); color: white; }
      .question::after { content: "ก ข"; position: absolute; right: 18px; bottom: -16px; color: #ffffff14; font-size: 80px; font-weight: 900; }
      .question p { position: relative; z-index: 1; margin: 0 0 8px; color: #aee2ff; font-size: 12px; font-weight: 800; }
      .question h4 { position: relative; z-index: 1; max-width: 92%; margin: 0; font-size: 20px; line-height: 1.5; }
      .words { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 9px; margin-top: 13px; }
      .word { min-height: 45px; display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border: 1px solid #d8e2eb; border-radius: 999px; background: white; color: #34445a; font-size: 15px; font-weight: 850; transition: .16s ease; }
      .word:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--lesson-accent); }
      .word.selected { border-color: var(--lesson-accent); background: color-mix(in srgb, var(--lesson-accent) 11%, white); color: var(--lesson-accent); }
      .word.correct { border-color: #28a76d; background: #e9f9f1; color: #117348; }
      .word.missed { border: 2px dashed #38a675; background: #f4fcf8; color: #14734b; }
      .word.wrong { border-color: #df5363; background: #fff0f2; color: #ad2538; }
      .word.muted { opacity: .45; }
      .submit { width: 100%; min-height: 47px; margin-top: 14px; border: 0; border-radius: 13px; background: var(--lesson-accent); color: white; font-size: 14px; font-weight: 900; box-shadow: 0 8px 20px color-mix(in srgb, var(--lesson-accent) 24%, transparent); }
      .submit:disabled { cursor: not-allowed; opacity: .42; box-shadow: none; }
      .answer-result { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 13px; margin-top: 14px; padding: 13px; border: 1px solid #f1c3ca; border-radius: 16px; background: #fff5f6; color: #8f2738; }
      .answer-result.perfect { border-color: #aedad0; background: #effaf5; color: #126f48; }
      .answer-score strong { display: block; font-size: 20px; }
      .answer-score small { display: block; font-size: 10px; font-weight: 800; }
      .answer-result strong { font-size: 13px; }
      .answer-result p { margin: 3px 0 0; font-size: 11px; line-height: 1.45; }
      .answer-actions { display: flex; flex-direction: column; gap: 6px; }
      .context-actions { display: flex; gap: 8px; margin-top: 12px; }
      .context-actions .submit { flex: 1; margin-top: 0; }
      .context-actions .speed-start { width: auto; flex: 1; margin-top: 0; }
      .again { border: 0; border-radius: 10px; padding: 8px 10px; background: currentColor; color: white; font-size: 11px; font-weight: 850; }
      .share-result { padding: 8px 10px; background: white; }
      .history { margin-top: 22px; padding: 20px; border: 1px solid var(--line); border-radius: 20px; background: #ffffffe8; }
      .history h3 { margin: 3px 0 0; color: var(--deep); font-size: 21px; }
      .history-list { display: grid; gap: 8px; margin-top: 13px; }
      .history-item { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #f7f9fb; font-size: 13px; }
      .history-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
      .history-item strong, .history-item small { display: block; }
      .history-item small, .history-item time { color: #7b8797; font-size: 11px; }
      .history-item b { color: var(--blue); }
      footer { padding: 0 0 30px; color: #7b8797; font-size: 12px; }
      body[data-theme="dark"] { --bg: #0e1727; --ink: #e8f0fb; --muted: #a9b7ca; --line: #2b3d55; --deep: #dbeaff; background: radial-gradient(circle at 10% 5%, #f6bd2714, transparent 23rem), radial-gradient(circle at 94% 20%, #087fbd20, transparent 27rem), var(--bg); }
      body[data-theme="dark"] .header, body[data-theme="dark"] .profile, body[data-theme="dark"] .tab, body[data-theme="dark"] .card, body[data-theme="dark"] .overview, body[data-theme="dark"] .history { background: #142237ee; border-color: #2b3d55; }

      body[data-theme="dark"] .theme-toggle, body[data-theme="dark"] .mode-button, body[data-theme="dark"] .context-option, body[data-theme="dark"] .word, body[data-theme="dark"] .match-word, body[data-theme="dark"] .video-rate, body[data-theme="dark"] .reset-progress, body[data-theme="dark"] .share-result, body[data-theme="dark"] .requirement, body[data-theme="dark"] .history-item { background: #1a2c43; border-color: #39516b; color: #dce9f7; }
      body[data-theme="dark"] .context-card, body[data-theme="dark"] .match-card { background: #172a40; border-color: #334b67; }
      body[data-theme="dark"] .context-label, body[data-theme="dark"] .match-card > p, body[data-theme="dark"] .match-column-title, body[data-theme="dark"] .match-status, body[data-theme="dark"] .context-feedback, body[data-theme="dark"] .score-strip span { color: #aabbd0; }
      body[data-theme="dark"] .overview-score { background: #123d55; color: #8cdbff; }
      body[data-theme="dark"] .badge { background: #1a2c43; border-color: #39516b; color: #aabbd0; }
      body[data-theme="dark"] .badge.earned { background: #143c35; border-color: #2c7a64; color: #86e0b4; }
      @media (max-width: 900px) {
        .intro, .workspace { grid-template-columns: 1fr; }
        .profile { min-width: 0; }
      }
      @media (max-width: 620px) {
        .shell { width: min(100% - 20px, 1420px); }
        main { padding-top: 17px; }
        .teacher { display: none; }
        .header-tools { gap: 4px; }
        .theme-toggle { width: 38px; height: 38px; border-radius: 11px; }
        .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
        .tab { min-height: 64px; padding: 9px 8px; gap: 7px; }
        .tab-number { width: 31px; height: 31px; border-radius: 10px; font-size: 11px; }
        .tab strong { font-size: 12px; }
        .tab small { font-size: 9px; }
        .tab-status { font-size: 14px; }
        .profile { display: grid; grid-template-columns: auto 1fr 90px; gap: 9px; padding: 11px; }
        .profile input { font-size: 13px; }
        .card-head, .game-head { padding-inline: 14px; }
        .watch, .game-body { padding-inline: 14px; }
        .context-options { grid-template-columns: 1fr; }
        .context-sentence { font-size: 18px; }
        .speed-intro h4 { font-size: 18px; }
        .overview { grid-template-columns: 1fr; align-items: flex-start; }
        .overview-top { align-items: flex-start; }
        .overview-actions { width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .overview-complete { text-align: left; }
        .match-grid { gap: 8px; }
        .match-word { min-height: 43px; padding-inline: 9px; font-size: 13px; }
        .video-tools { align-items: flex-start; flex-direction: column; }
        .video-rate-buttons { justify-content: flex-start; }
        .overview-score { flex: 0 0 auto; }
        .answer-result { grid-template-columns: auto 1fr; }
        .answer-actions { grid-column: 1 / -1; width: 100%; flex-direction: row; }
        .answer-actions button { flex: 1; }
        .context-actions { flex-wrap: wrap; }
        .context-actions button { flex: 1 1 120px; }
        .history-item { grid-template-columns: 8px 1fr auto; }
        .history-item time { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="shell header-inner">
        <div class="brand">
          <div class="logo"><img src="images/school-logo.png" alt="ตราโรงเรียนขลุงรัชดาภิเษก" /></div>
          <div>
            <p class="kicker">ห้องเรียนภาษาไทย ม.4</p>
            <h1>คลังคำไทย</h1>
          </div>
        </div>
        <div class="header-tools">
          <div class="teacher"><strong>นางสาวกรรณาภรณ์ พุฒชงค์</strong>โรงเรียนขลุงรัชดาภิเษก จังหวัดจันทบุรี</div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="สลับโหมดการแสดงผล">☾</button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="intro">
        <div>
          <div class="eyebrow">✦ 4 คลิป · 16 ภารกิจคำไวพจน์</div>
          <h2>ดูคลิป แล้วจิ้มคำตอบที่ถูกให้ครบ</h2>
          <p>ดูคลิปให้จบ แล้วเลือกโหมดฝึกที่เหมาะกับตัวเอง</p>
        </div>
        <div class="profile" aria-label="ข้อมูลผู้เล่น">
          <div class="profile-icon">👤</div>
          <label><span>ชื่อ–นามสกุล</span><input id="playerName" placeholder="กรอกชื่อผู้เล่น" /></label>
          <label class="class-field"><span>ชั้น/ห้อง</span><input id="playerClass" placeholder="ม.4/1" /></label>
        </div>
      </section>

      <section class="overview" id="overview"></section>

      <nav id="lessonTabs" class="tabs" aria-label="เลือกบทเรียน"></nav>

      <section class="workspace">
        <article class="card video-card" id="videoCard"></article>
        <article class="card game" id="gameCard"></article>
      </section>

      <section class="history" id="history" hidden></section>
    </main>
    <footer class="shell">สื่อการเรียนรู้ภาษาไทย ระดับชั้นมัธยมศึกษาปีที่ 4 · โรงเรียนขลุงรัชดาภิเษก</footer>

    <script>
      const lessons = [
        {
          id: "choy", number: "01", title: "ฉ่อยม้า", short: "ฉ่อยม้า", format: "เพลงฉ่อย", duration: "1:25 นาที",
          video: "videos/choy.mp4", poster: "images/cover-choy.jpg", accent: "#ba6b15",
          question: "คำใดปรากฏในคลิปและใช้แทนคำว่า “ม้า”",
          correct: ["พาชี", "อาชาไนย", "สินธพ", "แสะ", "อัศวะ"],
          incorrect: ["ดุรงค์", "สกุณา", "คชสาร", "พยัคฆา", "มีนา", "กุญชร", "วิหค", "มฤค", "วานร", "อุรค", "มยุรา", "สุกร"],
          explanation: "คำตอบจากคลิป ได้แก่ พาชี อาชาไนย สินธพ แสะ และอัศวะ",
          meaning: "ม้า",
          context: { sentence: "เจ้าชายทรง ______ ออกศึก", options: ["อาชาไนย", "สกุณา", "นที", "คีรี"], answer: "อาชาไนย", explanation: "อาชาไนย เป็นคำไวพจน์ที่หมายถึงม้า และใช้ในบริบทนี้ได้ถูกต้อง" },
          pairs: [["พาชี", "ม้า"], ["อริ", "ศัตรู"], ["ชล", "น้ำ"], ["ผกา", "ดอกไม้"]]
        },
        {
          id: "legend", number: "02", title: "ตำนานเรื่องเล่า", short: "ตำนานเรื่องเล่า", format: "เรื่องเล่า", duration: "2:50 นาที",
          video: "videos/legend.mp4", poster: "images/cover-legend.jpg", accent: "#4e568f",
          question: "ข้อใดเป็นคำไวพจน์ที่มีความหมายว่า “ศัตรู” ในคลิปวิดีโอ",
          correct: ["อริราช", "ปัจนึก", "อริชน", "ไพรี", "ปรปักษ์", "ปัจจามิตร", "อริ"],
          incorrect: ["ไพร่พล", "โยธา", "พล", "เสนา", "อำมาตย์", "ภูมินทร์", "นฤบดี", "ราษฎร", "ประชา", "จอมทัพ", "กองทัพ", "ขุนพล", "บริวาร", "เสนาบดี"],
          explanation: "คำตอบจากคลิป ได้แก่ อริราช ปัจนึก อริชน ไพรี ปรปักษ์ ปัจจามิตร และอริ",
          meaning: "ศัตรู",
          context: { sentence: "ทหารช่วยกันป้องกันเมืองจาก ______", options: ["ปรปักษ์", "มาลี", "คีรี", "ธารา"], answer: "ปรปักษ์", explanation: "ปรปักษ์ หมายถึงศัตรูหรือฝ่ายตรงข้าม จึงเหมาะกับประโยคนี้" },
          pairs: [["ปัจนึก", "ศัตรู"], ["อาชาไนย", "ม้า"], ["พนา", "ป่า"], ["คีรี", "ภูเขา"]]
        },
        {
          id: "song", number: "03", title: "เพลงคำไวพจน์", short: "เพลง", format: "บทเพลง", duration: "4:13 นาที",
          video: "videos/song.mp4", poster: "images/cover-song.jpg", accent: "#147f78",
          question: "ข้อใดเป็นคำไวพจน์ที่มีความหมายว่า “ศัตรู” ในคลิปวิดีโอ",
          correct: ["อริ", "ดัสกร", "ไพรี", "ไพริน", "ข้าศึก", "เวรี"],
          incorrect: ["ดุรงค์", "สกุณา", "คชสาร", "พยัคฆา", "มีนา", "วิหค", "กุญชร", "มฤค", "วานร", "มัจฉา", "วารี", "นภา", "บุปผา"],
          explanation: "คำตอบจากคลิป ได้แก่ อริ ดัสกร ไพรี ไพริน ข้าศึก และเวรี",
          meaning: "ศัตรู",
          context: { sentence: "กองทัพเตรียมรับมือกับ ______", options: ["ไพรี", "วิหค", "พนา", "อัมพร"], answer: "ไพรี", explanation: "ไพรี หมายถึงศัตรู จึงเติมในประโยคนี้ได้ถูกต้อง" },
          pairs: [["ดัสกร", "ศัตรู"], ["วายุ", "ลม"], ["จันทรา", "พระจันทร์"], ["บุปผา", "ดอกไม้"]]
        },
        {
          id: "horse-poem", number: "04", title: "กลอนคำไวพจน์ ม้า", short: "กลอนม้า", format: "กลอนคำไวพจน์", duration: "1:18 นาที",
          video: "videos/horse-poem.mp4", poster: "images/cover-horse.jpg", accent: "#a33c67",
          question: "คำใดเป็นคำไวพจน์ที่มีความหมายว่า “ม้า” จากคลิปเพิ่มเติม",
          correct: ["พาชี", "อาชาไนย", "สินธพ", "แสะ", "อัศวะ"],
          incorrect: ["สกุณา", "คชสาร", "พยัคฆา", "มีนา", "วิหค", "มฤค", "วานร", "อุรค", "มยุรา", "สุกร"],
          explanation: "คำไวพจน์ของม้า ได้แก่ พาชี อาชาไนย สินธพ แสะ และอัศวะ",
          meaning: "ม้า",
          context: { sentence: "กวีพรรณนาว่า ______ ควบผ่านทุ่งกว้าง", options: ["พาชี", "สกุณา", "นที", "คีรี"], answer: "พาชี", explanation: "พาชี เป็นคำไวพจน์ของม้า จึงเหมาะกับประโยคนี้" },
          pairs: [["พาชี", "ม้า"], ["อริ", "ศัตรู"], ["นที", "น้ำ"], ["ไศล", "ภูเขา"]]
        }
      ];

      const state = {
        active: 0,
        progress: JSON.parse(localStorage.getItem("thai-game-progress") || "{}"),
        unlocked: JSON.parse(localStorage.getItem("thai-game-unlocked") || "{}"),
        selected: [],
        submitted: false,
        score: 0,
        options: [],
        attempts: JSON.parse(localStorage.getItem("thai-game-attempts") || "[]"),
        mode: "multi",
        contextChoice: "",
        contextSubmitted: false,
        speedStarted: false,
        speedFinished: false,
        speedRound: 0,
        speedHits: 0,
        speedSeconds: 30,
        speedOptions: [],
        speedTimer: null,
        matchLeft: "",
        matchRight: "",
        matchMatched: [],
        matchLeftWords: [],
        matchRightWords: [],
        matchSubmitted: false,
        matchError: "",
        matchBusy: false
      };
      const nameInput = document.getElementById("playerName");
      const classInput = document.getElementById("playerClass");
      const themeToggle = document.getElementById("themeToggle");
      const videoRates = JSON.parse(localStorage.getItem("thai-video-rates") || "{}");
      nameInput.value = localStorage.getItem("thai-game-name") || "";
      classInput.value = localStorage.getItem("thai-game-class") || "";
      const lesson = () => lessons[state.active];
      const profileReady = () => nameInput.value.trim().length > 1 && classInput.value.trim().length > 0;
      const shuffle = (items) => [...items].sort(() => Math.random() - 0.5);
      const saveProgress = () => {
        localStorage.setItem("thai-game-progress", JSON.stringify(state.progress));
        localStorage.setItem("thai-game-unlocked", JSON.stringify(state.unlocked));
      };
      const clearSpeedTimer = () => {
        if (state.speedTimer) { clearInterval(state.speedTimer); state.speedTimer = null; }
      };
      const modeLabels = { multi: "คลังคำ", context: "เติมบริบท", speed: "ท้าทาย 30 วิ", match: "จับคู่ความหมาย" };
      const modeIcons = { multi: "☷", context: "✎", speed: "⏱", match: "⟷" };
      const applyTheme = (theme) => {
        document.body.dataset.theme = theme;
        themeToggle.textContent = theme === "dark" ? "☀" : "☾";
        themeToggle.title = theme === "dark" ? "ใช้โหมดสว่าง" : "ใช้โหมดมืด";
        themeToggle.setAttribute("aria-label", theme === "dark" ? "ใช้โหมดสว่าง" : "ใช้โหมดมืด");
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === "dark" ? "#0e1727" : "#087fbd";
      };
      applyTheme(localStorage.getItem("thai-game-theme") || "light");
      themeToggle.addEventListener("click", () => {
        const next = document.body.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem("thai-game-theme", next);
        applyTheme(next);
      });
      const recordAttempt = (item, score, mode) => {
        const attempt = { id: Date.now(), name: nameInput.value.trim(), classroom: classInput.value.trim(), lesson: item.short, mode, score, date: new Intl.DateTimeFormat("th-TH", { dateStyle: "short", timeStyle: "short" }).format(new Date()) };
        state.attempts = [attempt, ...state.attempts].slice(0, 12);
        localStorage.setItem("thai-game-attempts", JSON.stringify(state.attempts));
      };
      const resetMode = (mode) => {
        clearSpeedTimer();
        state.mode = mode;
        state.selected = [];
        state.submitted = false;
        state.score = 0;
        state.contextChoice = "";
        state.contextSubmitted = false;
        state.speedStarted = false;
        state.speedFinished = false;
        state.speedRound = 0;
        state.speedHits = 0;
        state.speedSeconds = 30;
        state.speedOptions = [];
        state.matchLeft = "";
        state.matchRight = "";
        state.matchMatched = [];
        state.matchLeftWords = [];
        state.matchRightWords = [];
        state.matchSubmitted = false;
        state.matchError = "";
        state.matchBusy = false;
        state.options = shuffle([...lesson().correct, ...lesson().incorrect]);
      };
      const startSpeedRound = () => {
        const item = lesson();
        state.speedOptions = shuffle([
          ...item.correct.slice(0, Math.min(3, item.correct.length)),
          ...item.incorrect.slice(0, 5),
        ]);
      };
      const finishSpeed = () => {
        if (state.speedFinished) return;
        clearSpeedTimer();
        state.speedFinished = true;
        state.speedStarted = false;
        state.score = Math.round((state.speedHits / 5) * 100);
        recordAttempt(lesson(), state.score, "ท้าทาย 30 วิ");
        renderGame();
        renderOverview();
        renderHistory();
      };
      const shareResult = async (item, score, mode) => {
        const player = nameInput.value.trim() || "ผู้เล่น";
        const text = `${player} ทำภารกิจ “${item.short} · ${mode}” ได้ ${score}/100 คะแนน ในคลังคำไทย`;
        try {
          if (navigator.share) {
            await navigator.share({ title: "คลังคำไทย", text });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
            alert("คัดลอกผลคะแนนแล้ว นำไปส่งให้ครูได้เลย");
          } else {
            window.prompt("คัดลอกข้อความนี้เพื่อแชร์ผลคะแนน", text);
          }
        } catch (error) {
          if (error && error.name !== "AbortError") alert("ยังแชร์ไม่ได้ ลองอีกครั้งนะ");
        }
      };
      const attachShareButton = (game, item) => {
        const button = game.querySelector(".share-result");
        if (button) button.addEventListener("click", () => shareResult(item, state.score, modeLabels[state.mode]));
      };
      const clearAllProgress = () => {
        if (!confirm("ล้างคะแนน ประวัติ และการปลดล็อกทั้งหมดบนอุปกรณ์นี้ใช่ไหม?")) return;
        clearSpeedTimer();
        state.progress = {};
        state.unlocked = {};
        state.attempts = [];
        localStorage.removeItem("thai-game-progress");
        localStorage.removeItem("thai-game-unlocked");
        localStorage.removeItem("thai-game-attempts");
        resetMode(state.mode);
        renderAll();
      };

      function renderTabs() {
        document.getElementById("lessonTabs").innerHTML = lessons.map((item, index) => `
          <button class="tab ${index === state.active ? "active" : ""}" data-index="${index}">
            <span class="tab-number">${item.number}</span><span class="tab-text"><strong>${item.short}</strong><small>${item.format} · ${item.duration}</small></span>
            <span class="tab-status">${state.unlocked[item.id] ? "✓" : "🔒"}</span>
          </button>`).join("");
        document.querySelectorAll(".tab").forEach((button) => button.addEventListener("click", () => {
          state.active = Number(button.dataset.index);
          resetMode(state.mode);
          renderAll();
        }));
      }

      function renderVideo() {
        const item = lesson();
        const percent = state.unlocked[item.id] ? 100 : (state.progress[item.id] || 0);
        const selectedRate = Number(videoRates[item.id] || 1);
        document.getElementById("videoCard").style.setProperty("--lesson-accent", item.accent);
        document.getElementById("videoCard").innerHTML = `
          <div class="card-head"><div><span>วิดีโอบทเรียน · ด่าน ${item.number}</span><h3>${item.title}</h3></div><div class="pill">◷ ${item.duration}</div></div>
          <div class="video-frame"><video id="lessonVideo" src="${item.video}" poster="${item.poster}" preload="metadata" controls controlsList="nodownload" playsinline></video><div class="video-badge">▶ รับชมให้ครบเพื่อปลดล็อก</div></div>
          <div class="watch"><div class="watch-row"><span>ความคืบหน้าการรับชม</span><strong>${state.unlocked[item.id] ? "ปลดล็อกแล้ว" : percent + "%"}</strong></div><div class="progress"><div style="width:${percent}%"></div></div><p class="watch-note">▣ รับชมอย่างน้อย 95% แล้วเกมจะเปิดอัตโนมัติ</p><div class="video-tools"><span>ความเร็วการเล่น</span><div class="video-rate-buttons">${[0.75, 1, 1.25, 1.5, 2].map((rate) => `<button class="video-rate ${selectedRate === rate ? "active" : ""}" data-rate="${rate}" type="button">${rate}×</button>`).join("")}</div></div></div>`;
        const video = document.getElementById("lessonVideo");
        video.playbackRate = selectedRate;
        document.querySelectorAll("[data-rate]").forEach((button) => button.addEventListener("click", () => {
          const rate = Number(button.dataset.rate);
          videoRates[item.id] = rate;
          localStorage.setItem("thai-video-rates", JSON.stringify(videoRates));
          video.playbackRate = rate;
          document.querySelectorAll("[data-rate]").forEach((candidate) => candidate.classList.toggle("active", Number(candidate.dataset.rate) === rate));
        }));
        video.addEventListener("error", () => {
          const badge = document.querySelector("#videoCard .video-badge");
          if (badge) badge.textContent = "⚠ โหลดวิดีโอไม่สำเร็จ ตรวจว่าอัปโหลดโฟลเดอร์ videos แล้ว";
        });
        video.addEventListener("timeupdate", () => {
          if (!Number.isFinite(video.duration) || video.duration === 0) return;
          const next = Math.min(100, Math.round(video.currentTime / video.duration * 100));
          const newlyUnlocked = !state.unlocked[item.id] && next >= 95;
          state.progress[item.id] = Math.max(state.progress[item.id] || 0, next);
          if (next >= 95) state.unlocked[item.id] = true;
          saveProgress();
          const label = document.querySelector("#videoCard .watch-row strong");
          const bar = document.querySelector("#videoCard .progress > div");
          if (label) label.textContent = state.unlocked[item.id] ? "ปลดล็อกแล้ว" : `${state.progress[item.id]}%`;
          if (bar) bar.style.width = `${state.unlocked[item.id] ? 100 : state.progress[item.id]}%`;
          if (newlyUnlocked) { renderTabs(); renderGame(); }
        });
        video.addEventListener("ended", () => { state.unlocked[item.id] = true; saveProgress(); renderAll(); });
      }

      function attachModeButtons(game) {
        game.querySelectorAll(".mode-button").forEach((button) => button.addEventListener("click", () => {
          if (button.dataset.mode === state.mode) return;
          resetMode(button.dataset.mode);
          renderGame();
        }));
      }

      function renderModeButtons() {
        return `<div class="mode-switch" aria-label="เลือกโหมดเกม">${Object.entries(modeLabels).map(([key, label]) => `<button class="mode-button ${state.mode === key ? "active" : ""}" data-mode="${key}">${modeIcons[key]} ${label}</button>`).join("")}</div>`;
      }

      function renderGame() {
        const item = lesson();
        const game = document.getElementById("gameCard");
        game.style.setProperty("--lesson-accent", item.accent);
        const ready = profileReady() && state.unlocked[item.id];
        const modeTitle = { multi: "จิ้มคำที่ถูกทั้งหมด", context: "เติมคำในบริบท", speed: "ภารกิจจับเวลา", match: "จับคู่ความหมาย" }[state.mode];
        const title = `<div class="game-head"><div class="game-title"><span class="game-icon">🎮</span><div><span>ภารกิจหลังดูคลิป</span><h3>${modeTitle}</h3></div></div><div class="pill">${modeLabels[state.mode]}</div></div>`;
        const frame = (body) => { game.innerHTML = title + renderModeButtons() + body; attachModeButtons(game); attachShareButton(game, item); };
        if (!ready) {
          frame(`<div class="locked"><div class="lock-art">🔒</div><h4>เกมยังไม่ปลดล็อก</h4><p>ทำสองขั้นตอนด้านล่างให้ครบ แล้วเริ่มภารกิจได้ทันที</p><div class="requirements"><div class="requirement ${profileReady() ? "done" : ""}">${profileReady() ? "✓" : "👤"}<span>กรอกชื่อและชั้นเรียน</span></div><div class="requirement ${state.unlocked[item.id] ? "done" : ""}">${state.unlocked[item.id] ? "✓" : "▶"}<span>รับชมวิดีโอให้จบ</span></div></div></div>`);
          return;
        }

        if (state.mode === "context") {
          const context = item.context;
          const contextOptions = context.options.map((word) => {
            const selected = state.contextChoice === word;
            let status = selected ? "selected" : "";
            if (state.contextSubmitted) status = word === context.answer ? "correct" : (selected ? "wrong" : "muted");
            return `<button class="context-option ${status}" data-context-word="${word}" ${state.contextSubmitted ? "disabled" : ""}>${word}${state.contextSubmitted && word === context.answer ? " ✓" : ""}</button>`;
          }).join("");
          const contextBody = `<div class="game-body"><div class="score-strip"><span>✎ เลือกคำที่เหมาะกับประโยค</span><span>1 ข้อต่อด่าน</span></div><div class="context-card"><p class="context-label">เติมคำไวพจน์ให้ได้ใจความ</p><p class="context-sentence">${context.sentence}</p><div class="context-options">${contextOptions}</div></div>${state.contextSubmitted ? `<div class="context-feedback">${state.contextChoice === context.answer ? "✓ ถูกต้อง! " : `ยังไม่ถูก คำตอบคือ “${context.answer}” `}${context.explanation}</div><div class="context-actions"><button class="submit again-context">↻ เล่นอีกครั้ง</button><button class="share-result" type="button">↗ แชร์ผล</button></div>` : `<button class="submit context-submit" ${state.contextChoice ? "" : "disabled"}>ตรวจคำตอบ</button>`}</div>`;
          frame(contextBody);
          game.querySelectorAll("[data-context-word]").forEach((button) => button.addEventListener("click", () => { state.contextChoice = button.dataset.contextWord; renderGame(); }));
          const contextSubmit = game.querySelector(".context-submit");
          if (contextSubmit) contextSubmit.addEventListener("click", () => { state.contextSubmitted = true; state.score = state.contextChoice === context.answer ? 100 : 0; recordAttempt(item, state.score, modeLabels.context); renderGame(); renderOverview(); renderHistory(); });
          const contextAgain = game.querySelector(".again-context");
          if (contextAgain) contextAgain.addEventListener("click", () => { state.contextChoice = ""; state.contextSubmitted = false; state.score = 0; renderGame(); });
          return;
        }

        if (state.mode === "match") {
          const pairs = item.pairs || [];
          if (state.matchSubmitted) {
            frame(`<div class="game-body"><div class="result"><div class="trophy">🏆</div><h4>จับคู่ครบทุกคู่แล้ว!</h4><p>คุณเชื่อมคำไวพจน์กับความหมายได้ครบทั้ง ${pairs.length} คู่</p><div class="score-strip"><span>คะแนนด่านนี้</span><span>${state.score}/100</span></div><div class="context-actions"><button class="submit match-again">↻ เล่นอีกครั้ง</button><button class="share-result" type="button">↗ แชร์ผล</button></div></div></div>`);
            game.querySelector(".match-again").addEventListener("click", () => { resetMode("match"); renderGame(); });
            return;
          }
          if (!state.matchLeftWords.length || !state.matchRightWords.length) {
            state.matchLeftWords = shuffle(pairs.map(([word]) => word));
            state.matchRightWords = shuffle(pairs.map(([, meaning]) => meaning));
          }
          const leftWords = state.matchLeftWords.map((word) => {
            const matched = state.matchMatched.includes(word);
            const selected = state.matchLeft === word;
            const wrong = Boolean(state.matchError && selected);
            return `<button class="match-word ${matched ? "matched" : wrong ? "wrong" : selected ? "selected" : ""}" data-match-left="${word}" ${matched || state.matchBusy ? "disabled" : ""}>${word}${matched ? " ✓" : ""}</button>`;
          }).join("");
          const rightWords = state.matchRightWords.map((meaning) => {
            const matched = state.matchMatched.some((word) => pairs.find(([left]) => left === word)?.[1] === meaning);
            const selected = state.matchRight === meaning;
            const wrong = Boolean(state.matchError && selected);
            return `<button class="match-word ${matched ? "matched" : wrong ? "wrong" : selected ? "selected" : ""}" data-match-right="${meaning}" ${matched || state.matchBusy ? "disabled" : ""}>${meaning}${matched ? " ✓" : ""}</button>`;
          }).join("");
          const matchBody = `<div class="game-body"><div class="score-strip"><span>⟷ แตะคำและความหมายที่ตรงกัน</span><span>จับคู่แล้ว ${state.matchMatched.length}/${pairs.length}</span></div><div class="match-card"><p>เลือกคำฝั่งซ้าย 1 คำ แล้วเลือกความหมายฝั่งขวา</p><div class="match-grid"><div class="match-column"><span class="match-column-title">คำไวพจน์</span>${leftWords}</div><div class="match-column"><span class="match-column-title">ความหมาย</span>${rightWords}</div></div><div class="match-status"><span>ความคืบหน้า</span><strong>${state.matchMatched.length}/${pairs.length} คู่</strong></div>${state.matchError ? `<div class="match-feedback">${state.matchError}</div>` : ""}</div></div>`;
          frame(matchBody);
          const selectMatch = (side, value) => {
            if (state.matchBusy) return;
            if (side === "left") state.matchLeft = state.matchLeft === value ? "" : value;
            else state.matchRight = state.matchRight === value ? "" : value;
            state.matchError = "";
            if (!state.matchLeft || !state.matchRight) { renderGame(); return; }
            const pair = pairs.find(([word, meaning]) => word === state.matchLeft && meaning === state.matchRight);
            if (pair) {
              state.matchMatched = [...state.matchMatched, pair[0]];
              state.matchLeft = "";
              state.matchRight = "";
              if (state.matchMatched.length === pairs.length) {
                state.matchSubmitted = true;
                state.score = 100;
                recordAttempt(item, state.score, modeLabels.match);
                renderGame();
                renderOverview();
                renderHistory();
              } else renderGame();
            } else {
              state.matchError = "ยังไม่ตรงกัน ลองจับคู่อีกครั้ง";
              state.matchBusy = true;
              renderGame();
              setTimeout(() => {
                if (state.mode !== "match" || state.active !== lessons.indexOf(item)) return;
                state.matchLeft = "";
                state.matchRight = "";
                state.matchError = "";
                state.matchBusy = false;
                renderGame();
              }, 650);
            }
          };
          game.querySelectorAll("[data-match-left]").forEach((button) => button.addEventListener("click", () => selectMatch("left", button.dataset.matchLeft)));
          game.querySelectorAll("[data-match-right]").forEach((button) => button.addEventListener("click", () => selectMatch("right", button.dataset.matchRight)));
          return;
        }

        if (state.mode === "speed") {
          if (!state.speedStarted && !state.speedFinished) {
            frame(`<div class="game-body"><div class="speed-card"><div class="speed-intro"><div><h4>ท้าทาย 30 วินาที</h4><p>ตอบให้ได้ 5 ข้อก่อนหมดเวลา</p></div><div class="speed-time">30</div></div><button class="speed-start">▶ เริ่มภารกิจ</button></div></div>`);
            game.querySelector(".speed-start").addEventListener("click", () => {
              state.speedStarted = true;
              state.speedSeconds = 30;
              state.speedRound = 0;
              state.speedHits = 0;
              startSpeedRound();
              renderGame();
              clearSpeedTimer();
              state.speedTimer = setInterval(() => {
                state.speedSeconds -= 1;
                const timer = document.querySelector(".speed-time");
                if (timer) timer.textContent = state.speedSeconds;
                if (state.speedSeconds <= 0) finishSpeed();
              }, 1000);
            });
            return;
          }
          if (state.speedFinished) {
            frame(`<div class="game-body"><div class="speed-card"><div class="speed-intro"><div><h4>จบภารกิจแล้ว</h4><p>ตอบถูก ${state.speedHits} จาก 5 ข้อ</p></div><div class="speed-time">${state.score}</div></div><div class="context-feedback">คะแนนท้าทาย: <strong>${state.score}/100</strong> · ฝึกซ้ำเพื่อเพิ่มความคล่องในการจำคำ</div><div class="context-actions"><button class="speed-start speed-again">↻ เริ่มใหม่</button><button class="share-result" type="button">↗ แชร์ผล</button></div></div></div>`);
            game.querySelector(".speed-again").addEventListener("click", () => { resetMode("speed"); renderGame(); });
            return;
          }
          const speedWords = state.speedOptions.map((word) => `<button class="speed-word" data-speed-word="${word}">${word}</button>`).join("");
          frame(`<div class="game-body"><div class="speed-card"><div class="speed-intro"><div><h4>เลือกคำไวพจน์</h4><p>ตอบให้ไว แล้วไปข้อต่อไป</p></div><div class="speed-time">${state.speedSeconds}</div></div><p class="speed-question">คำใดมีความหมายว่า <strong>“${item.meaning}”</strong></p><div class="speed-words">${speedWords}</div><div class="speed-meta"><span>ข้อ ${state.speedRound + 1}/5</span><span>ตอบถูก ${state.speedHits} ข้อ</span></div></div></div>`);
          game.querySelectorAll("[data-speed-word]").forEach((button) => button.addEventListener("click", () => {
            if (item.correct.includes(button.dataset.speedWord)) state.speedHits += 1;
            state.speedRound += 1;
            if (state.speedRound >= 5) finishSpeed();
            else { startSpeedRound(); renderGame(); }
          }));
          return;
        }

        if (!state.options.length) state.options = shuffle([...item.correct, ...item.incorrect]);
        const words = state.options.map((word) => {
          const chosen = state.selected.includes(word);
          const isCorrect = item.correct.includes(word);
          let status = chosen ? "selected" : "";
          if (state.submitted) status = isCorrect ? (chosen ? "correct" : "missed") : (chosen ? "wrong" : "muted");
          return `<button class="word ${status}" data-word="${word}" ${state.submitted ? "disabled" : ""}>${word}${state.submitted && isCorrect ? " ✓" : ""}${state.submitted && chosen && !isCorrect ? " ×" : ""}</button>`;
        }).join("");
        const correctSelected = state.selected.filter((word) => item.correct.includes(word)).length;
        const wrongSelected = state.selected.filter((word) => item.incorrect.includes(word)).length;
        const perfect = correctSelected === item.correct.length && wrongSelected === 0;
        const body = `<div class="game-body"><div class="score-strip"><span>✓ เลือกแล้ว ${state.selected.length} คำ</span><span>✦ คำตอบถูกมีมากกว่า 1 คำ</span></div><div class="question"><p>จิ้มเลือกทุกคำที่ถูกต้อง แล้วกดตรวจคำตอบ</p><h4>${item.question}</h4></div><div class="words">${words}</div>${state.submitted ? `<div class="answer-result ${perfect ? "perfect" : ""}"><div class="answer-score"><small>คะแนนด่านนี้</small><strong>${state.score}/100</strong></div><div><strong>${perfect ? "ถูกต้องครบทุกคำ!" : `เลือกถูก ${correctSelected} จาก ${item.correct.length} คำ`}</strong><p>${item.explanation}</p></div><div class="answer-actions"><button class="share-result" type="button">↗ แชร์ผล</button><button class="again">↻ เล่นอีกครั้ง</button></div></div>` : `<button class="submit" ${state.selected.length ? "" : "disabled"}>ตรวจคำตอบ (${state.selected.length} คำ)</button>`}</div>`;
        frame(body);
        game.querySelectorAll(".word").forEach((button) => button.addEventListener("click", () => { const word = button.dataset.word; state.selected = state.selected.includes(word) ? state.selected.filter((item) => item !== word) : [...state.selected, word]; renderGame(); }));
        const submit = game.querySelector(".submit");
        if (submit) submit.addEventListener("click", () => { state.score = Math.max(0, Math.round(((correctSelected - wrongSelected) / item.correct.length) * 100)); state.submitted = true; recordAttempt(item, state.score, modeLabels.multi); renderGame(); renderOverview(); renderHistory(); });
        const again = game.querySelector(".again");
        if (again) again.addEventListener("click", () => { resetMode("multi"); renderGame(); });
      }

      function renderOverview() {
        const overview = document.getElementById("overview");
        const unlockedCount = lessons.filter((item) => state.unlocked[item.id]).length;
        const completedLessons = new Set(state.attempts.map((attempt) => attempt.lesson)).size;
        const average = state.attempts.length ? Math.round(state.attempts.reduce((sum, attempt) => sum + attempt.score, 0) / state.attempts.length) : 0;
        const progress = Math.round((unlockedCount / lessons.length) * 100);
        const badges = [
          ["นักสำรวจ", unlockedCount >= 1, "ปลดล็อกคลิปแรก"],
          ["นักสะสม", completedLessons >= 2, "ผ่าน 2 ด่าน"],
          ["ดาวเด่น", average >= 80, "คะแนนเฉลี่ย 80+"],
          ["ผู้พิชิต", unlockedCount === lessons.length && completedLessons === lessons.length, "ครบทุกด่าน"]
        ];
        overview.innerHTML = `<div class="overview-main"><div class="overview-top"><div><strong>เส้นทางการเรียนรู้</strong><small>ดูคลิปแล้ว ${unlockedCount}/${lessons.length} ด่าน · ผ่านภารกิจแล้ว ${completedLessons}/${lessons.length} ด่าน</small></div><div class="overview-score">เฉลี่ย ${average}/100</div></div><div class="overall-progress" aria-label="ความคืบหน้าการดูคลิป"><div style="width:${progress}%"></div></div><div class="badge-row">${badges.map(([label, earned, hint]) => `<span class="badge ${earned ? "earned" : ""}" title="${hint}">${earned ? "★" : "○"} ${label}</span>`).join("")}</div></div><div class="overview-actions"><span class="overview-complete">เล่นได้ 4 โหมด · 16 ภารกิจ</span><button id="resetProgress" class="reset-progress" type="button">↺ ล้างความคืบหน้า</button></div>`;
        document.getElementById("resetProgress").addEventListener("click", clearAllProgress);
      }

      function renderHistory() {
        const history = document.getElementById("history");
        if (!state.attempts.length) { history.hidden = true; return; }
        history.hidden = false;
        history.innerHTML = `<div class="eyebrow">▣ ผลการเรียนรู้ล่าสุด</div><h3>ประวัติการเล่นบนอุปกรณ์นี้</h3><div class="history-list">${state.attempts.slice(0, 4).map((attempt) => `<div class="history-item"><span class="history-dot"></span><div><strong>${attempt.name}</strong><small>${attempt.classroom} · ${attempt.lesson} · ${attempt.mode || "คลังคำ"}</small></div><b>${attempt.score}/100</b><time>${attempt.date}</time></div>`).join("")}</div>`;
      }

      function renderAll() { renderTabs(); renderVideo(); renderGame(); renderOverview(); renderHistory(); }
      nameInput.addEventListener("input", () => { localStorage.setItem("thai-game-name", nameInput.value); renderGame(); });
      classInput.addEventListener("input", () => { localStorage.setItem("thai-game-class", classInput.value); renderGame(); });
      state.options = shuffle([...lesson().correct, ...lesson().incorrect]);
      renderAll();
    </script>
  </body>
</html>
